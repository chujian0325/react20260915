<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <!-- 准备好一个容器 -->
    <div id="test"></div>
    <!-- 引入react核心库 -->
    <script type="text/javascript" src="../js/react.development.js"></script>

    <!-- 引入react-dom，用于支持react操作DOM -->
    <script
      type="text/javascript"
      src="../js/react-dom.development.js"
    ></script>
    <!-- 引入babel，用户将jsx转为js -->
    <script type="text/javascript" src="../js/babel.min.js"></script>

    <script type="text/babel">
      // 1. 创建类式组件
      //   构造器调用几次？ 1次
      class Weather extends React.Component {
        constructor(props) {
          super(props);
          console.log("constructor");
          this.state = {
            isHot: false,
            wind: "大风",
          };
          //解决changeWeather中this指向的问题
          this.changeWeather = this.changeWeather.bind(this);
        }

        // render调用了几次？ 1+n次，n是状态更新的次数
        render() {
          console.log("render");

          console.log(this);
          return (
            <h2 onClick={this.changeWeather}>
              今天天气很{this.state.isHot == true ? "炎热" : "凉爽"}
            </h2>
          );
        }
        
        // changeWeather调用几次？点击此次调几次
        changeWeather() {
          // changeWeather放在了Weather的原型对象上，供实例使用
          // 由于changeWeather是作为onClick的回调，所以不是通过实例调用的，是直接调用
          // 类中的方法默认开启了局部的严格模式，所以changeWeather中的this为undefined
          console.log("changeWeather");
          //   console.log("被点击了", this);
          //   注意：状态state不可直接更改，
          //   this.state.isHot = !this.state.isHot;//这是错误的写法
          //   状态state必须通过setState更改，且更新是一种合并，不是替换
          const isHot = this.state.isHot;
          this.setState({
            isHot: !isHot,
          });
        }
      }

      // 2. 渲染组件到页面
      ReactDOM.render(<Weather />, document.getElementById("test"));
      /**
       * 注意：
       * onClick中的Click要首字母大写
       * 事件方法不要加小括号，否则会直接调用
       */
    </script>
  </body>
</html>
